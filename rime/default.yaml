# Rime default settings
# encoding: utf-8

config_version: '1.1.0'

schema_list:
  - schema: shefirst

switcher:
  caption: 〔她先设置〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - shefirst_mode
    - neutral_mode
    - standard_mode
    - career_suggestions
    - positive_suggestions
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: false
  abbreviate_options: false
  option_list_separator: '／'

menu:
  page_size: 7

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

selector:
  bindings:
    ISO_Left_Tab: previous_candidate
    Shift+Tab: previous_candidate
    Tab: next_candidate

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
